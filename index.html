<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makani Family Tree</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1 id="title">Family Tree</h1>
    <p id="subtitle"></p>
  </div>

  <div class="searchbox">
    <input id="search" type="search" placeholder="Search a name…  (press /)"
           autocomplete="off" spellcheck="false" aria-label="Search for a person">
    <div id="results" hidden></div>
  </div>

  <div class="toolbar">
    <label class="toggle hide-sm">
      <input type="checkbox" id="btnAlly" checked>
      Alliances
    </label>
    <label class="toggle hide-sm">
      <input type="checkbox" id="btnGhost" checked>
      Unknown ancestors
    </label>

    <button class="tbtn" id="btnMe" hidden></button>
    <button class="tbtn" id="btnEdit" aria-pressed="false" title="Add, change or remove people">Edit</button>
    <button class="tbtn" id="btnOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
    <span id="zoomPct">100%</span>
    <button class="tbtn" id="btnIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
    <button class="tbtn" id="btnFit" title="Fit the whole tree (0)">Fit</button>
    <button class="tbtn" id="btnInfo" aria-pressed="false" title="Surnames, alliances and data checks">Family info</button>
    <button class="tbtn hide-sm" id="btnPrint" title="Print or save as PDF">Print</button>
    <button class="tbtn" id="btnTheme" title="Light / dark" aria-label="Toggle light or dark theme">◐</button>
  </div>
</header>

<div id="editbar" hidden></div>

<main id="stage">
  <div id="canvas">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    <div id="nodes"></div>
  </div>
</main>

<aside id="detail" class="panel" hidden aria-label="Person details"></aside>
<aside id="side" class="panel" hidden aria-label="Family information"></aside>

<!-- ==========================================================================
     Load order matters:
       data.js    the family itself   <- the file you edit
       kinship.js Telugu relationship terms
       layout.js  positions everything
       render.js  draws it
       editor.js  the in-page add / change / delete tools
       app.js     wires up the interface
     ====================================================================== -->
<script src="js/data.js"></script>
<script src="js/kinship.js"></script>
<script src="js/layout.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>

</body>
</html>
