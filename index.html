<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css?v=2026-09-05">
</head>
<body>

<header class="head">
  <h1 id="title">Family Tree</h1>
  <p id="subtitle"></p>
</header>

<div class="bar">
  <span class="find">
    <input id="q" type="search" placeholder="Search a name" autocomplete="off" spellcheck="false" aria-label="Search">
    <div id="hits" hidden></div>
  </span>
  <select id="only" aria-label="Show one family"></select>
  <button class="btn" id="btnEdit" aria-pressed="false">Edit</button>
  <button class="btn" id="btnOut" aria-label="Zoom out">&minus;</button>
  <span id="zoomPct" class="sub">100%</span>
  <button class="btn" id="btnIn" aria-label="Zoom in">+</button>
  <button class="btn" id="btnHome">Home</button>
  <button class="btn" id="btnInfo">Family info</button>
  <button class="btn" id="btnPrint">Print</button>
  <button class="btn" id="btnTheme" aria-label="Light or dark">&#9686;</button>
</div>

<div id="editbar" hidden></div>

<main id="stage"><div id="tree"></div></main>

<aside id="panel" class="panel" hidden></aside>

<!-- The ?v= on every file below is a cache buster, and it matters.
     GitHub Pages serves these with Cache-Control: max-age=600, so without it a
     returning visitor can get the NEW index.html alongside an OLD cached script
     and the page dies with a confusing error.
     Bump the date whenever you change anything in js/ or css/. -->
<script src="js/data.js?v=2026-09-05"></script>
<script src="js/kinship.js?v=2026-09-05"></script>
<script src="js/model.js?v=2026-09-05"></script>
<script src="js/tree.js?v=2026-09-05"></script>
<script src="js/github.js?v=2026-09-05"></script>
<script src="js/editor.js?v=2026-09-05"></script>
<script src="js/app.js?v=2026-09-05"></script>

</body>
</html>
