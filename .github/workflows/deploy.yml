# =============================================================================
#  Publish the family tree to GitHub Pages.
#
#  WHY THIS FILE EXISTS
#  --------------------
#  GitHub Pages has two modes, and they behave very differently:
#
#    "Deploy from a branch"  GitHub serves the branch itself. No workflow
#                            needed, but it quietly runs Jekyll over your
#                            files unless a .nojekyll file is present.
#
#    "GitHub Actions"        Nothing is published until a workflow uploads
#                            it. This is the current default for new
#                            repositories, and if there is no workflow the
#                            Actions tab simply stays empty and index.html
#                            never appears. That is the usual reason a
#                            perfectly good site never goes live.
#
#  This workflow covers the second mode: it takes the repository exactly as
#  it is, with no build step, and publishes it.
#
#  ONE SETTING IS STILL REQUIRED
#  -----------------------------
#  Repository -> Settings -> Pages -> Source -> "GitHub Actions".
#  A workflow file alone will not switch the mode for you.
# =============================================================================

name: Deploy to GitHub Pages

on:
  # every push to the main branch republishes the site
  push:
    branches: [main]
  # and you can run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the whole site
        uses: actions/upload-pages-artifact@v3
        with:
          # "." means the repository root, which is where index.html lives.
          # There is nothing to build: the browser reads the files directly.
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
